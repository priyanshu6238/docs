name: Debug Inspect (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run inspection script (headed, under Xvfb)
        env:
          GLIFIC_STAGING_URL: ${{ secrets.GLIFIC_STAGING_URL }}
          GLIFIC_STAGING_PHONE: ${{ secrets.GLIFIC_STAGING_PHONE }}
          GLIFIC_STAGING_PASSWORD: ${{ secrets.GLIFIC_STAGING_PASSWORD }}
        run: xvfb-run -a node .github/scripts/debug-inspect.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          if-no-files-found: ignore
