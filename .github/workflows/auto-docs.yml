name: Auto Docs (label-triggered)

# Fires when an issue is labeled "auto-docs". Investigates the ticket against
# the glific and glific-frontend repos, updates the relevant doc page(s) with
# Claude, captures a fresh screenshot of the real app for any page that needs
# one, and opens a PR for human review. Never auto-merges.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  auto-docs:
    if: github.event.label.name == 'auto-docs' && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@v7
        with:
          # A personal access token, not the default GITHUB_TOKEN, so the
          # commit/push/PR/comment below are attributed to and authorized as
          # a real account — matters once this points at the real upstream
          # glific/docs, where the default token (acting as github-actions[bot])
          # won't have permission to open a PR at all.
          token: ${{ secrets.GH_PAT }}

      - name: Checkout glific (backend, read-only context)
        uses: actions/checkout@v7
        with:
          repository: glific/glific
          path: repos/glific
          fetch-depth: 1

      - name: Checkout glific-frontend (read-only context)
        uses: actions/checkout@v7
        with:
          repository: glific/glific-frontend
          path: repos/glific-frontend
          fetch-depth: 1

      - name: Check out any PR branches referenced in the issue
        # Tickets sometimes point at a feature that's only on an unmerged PR
        # (e.g. "not merged to master, already deployed to staging") — check
        # that branch out in place of the default branch so Claude actually
        # sees the code being described.
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          frontend_pr=$(printf '%s' "$ISSUE_BODY" | grep -oE 'github\.com/glific/glific-frontend/pull/[0-9]+' | grep -oE '[0-9]+$' | head -1 || true)
          backend_pr=$(printf '%s' "$ISSUE_BODY" | grep -oE 'github\.com/glific/glific/pull/[0-9]+' | grep -oE '[0-9]+$' | head -1 || true)

          if [ -n "$frontend_pr" ]; then
            echo "Issue references glific-frontend PR #$frontend_pr — checking that out instead of the default branch"
            git -C repos/glific-frontend fetch --depth 1 origin "refs/pull/${frontend_pr}/head"
            git -C repos/glific-frontend checkout FETCH_HEAD
          fi

          if [ -n "$backend_pr" ]; then
            echo "Issue references glific PR #$backend_pr — checking that out instead of the default branch"
            git -C repos/glific fetch --depth 1 origin "refs/pull/${backend_pr}/head"
            git -C repos/glific checkout FETCH_HEAD
          fi

      - name: Build prompt
        id: build_prompt
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          envsubst < .github/scripts/docs-agent-prompt.md > /tmp/prompt.md
          {
            echo 'prompt<<EOF_PROMPT_9f3a1c'
            cat /tmp/prompt.md
            echo 'EOF_PROMPT_9f3a1c'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude doc-authoring step
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.build_prompt.outputs.prompt }}
          claude_args: |
            --max-turns 35
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git branch:*)"

      - name: Remove cloned context repos (never committed, not screenshotted)
        run: rm -rf repos

      - name: Guardrail - confirm Claude only touched docs/ and pr-body.md
        id: guardrail
        run: |
          # -z (not plain --porcelain) because doc folder names contain spaces,
          # e.g. "docs/3. Product Features/..." — git double-quotes any path
          # containing a space in the default format, which broke a plain
          # `cut`/case-glob parse (the quote itself doesn't match "docs/*").
          # -z disables that quoting and NUL-delimits entries instead.
          bad=0
          while IFS= read -r -d '' entry; do
            status="${entry:0:2}"
            f="${entry:3}"
            case "$status" in
              R*|C*) read -r -d '' _orig ;; # renames/copies: consume the paired old-path entry
            esac
            case "$f" in
              docs/*|pr-body.md) ;;
              *)
                echo "::error::Unexpected file changed outside docs/: $f"
                bad=1
                ;;
            esac
          done < <(git status --porcelain -z)
          if [ "$bad" = "1" ]; then
            echo "Claude's changes touched files outside the allowed scope. Aborting without committing." >&2
            exit 1
          fi

          if [ -f pr-body.md ] && [ "$(head -n1 pr-body.md)" = "SKIP" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment when skipped
        if: steps.guardrail.outputs.skip == 'true'
        run: |
          reason=$(tail -n +2 pr-body.md)
          gh issue comment "${{ github.event.issue.number }}" --body "Auto-docs pipeline ran but made no changes: ${reason:-no docs update was needed for this ticket.}"
          rm -f pr-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Set up Node
        if: steps.guardrail.outputs.skip == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        if: steps.guardrail.outputs.skip == 'false'
        run: yarn install --frozen-lockfile

      - name: Install Playwright browser
        if: steps.guardrail.outputs.skip == 'false'
        run: npx playwright install --with-deps chromium

      - name: Take screenshots and rewrite placeholders
        if: steps.guardrail.outputs.skip == 'false'
        env:
          GLIFIC_STAGING_URL: ${{ secrets.GLIFIC_STAGING_URL }}
          GLIFIC_STAGING_PHONE: ${{ secrets.GLIFIC_STAGING_PHONE }}
          GLIFIC_STAGING_PASSWORD: ${{ secrets.GLIFIC_STAGING_PASSWORD }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/take-screenshots.mjs

      - name: Open PR
        if: steps.guardrail.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          branch="docs/auto-${ISSUE_NUMBER}"
          # The branch name is deterministic (one per issue), so re-labeling
          # the same issue re-runs this from a fresh main checkout and would
          # collide with whatever an earlier run already pushed. Rather than
          # overwrite that earlier attempt, open a distinctly-named branch
          # and a separate PR instead.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            branch="docs/auto-${ISSUE_NUMBER}-${RUN_NUMBER}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs
          [ -d static/img/generated ] && git add static/img/generated
          git commit -m "docs: auto-update from issue #${ISSUE_NUMBER}"
          git push -u origin "$branch"

          {
            cat pr-body.md
            echo ""
            echo "Closes #${ISSUE_NUMBER}"
            echo ""
            echo "_Opened automatically by the auto-docs pipeline. Please review before merging._"
          } > /tmp/pr-body-final.md
          rm -f pr-body.md

          gh pr create \
            --title "docs: ${ISSUE_TITLE}" \
            --body-file /tmp/pr-body-final.md \
            --label auto-docs \
            --base main \
            --head "$branch"

          gh issue comment "$ISSUE_NUMBER" --body "Opened a docs PR for this: $(gh pr view "$branch" --json url -q .url)"
