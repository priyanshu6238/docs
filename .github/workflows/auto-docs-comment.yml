name: Auto Docs (PR feedback)

# Fires when someone comments "@claude ..." on a PR the auto-docs pipeline
# opened — either a general PR conversation comment (issue_comment) or an
# inline review comment attached to a specific diff line
# (pull_request_review_comment). Applies the requested change directly on
# the PR's existing branch (no new PR) and replies with what it did — inline,
# in the same thread, if that's how it was asked. Restricted to
# auto-docs-labeled PRs and to commenters with write access, so a random
# public comment can't trigger it.

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  respond:
    if: >
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
        github.event_name == 'pull_request_review_comment'
      ) &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Look up the PR this comment is on
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          # No checkout has happened yet at this point in the job, so there's
          # no .git dir for gh to infer the repo from — GH_REPO is required.
          head_ref=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName)
          is_auto_docs=$(gh pr view "$PR_NUMBER" --json labels -q '[.labels[].name] | any(. == "auto-docs")')
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head=$head_ref" >> "$GITHUB_OUTPUT"
          echo "is_auto_docs=$is_auto_docs" >> "$GITHUB_OUTPUT"

      - name: Checkout docs (PR branch)
        if: steps.pr.outputs.is_auto_docs == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head }}
          # A personal access token, not the default GITHUB_TOKEN — see
          # auto-docs.yml's "Checkout docs" step for why.
          token: ${{ secrets.GH_PAT }}

      - name: Checkout glific (backend, read-only context)
        if: steps.pr.outputs.is_auto_docs == 'true'
        uses: actions/checkout@v7
        with:
          repository: glific/glific
          path: repos/glific
          fetch-depth: 1

      - name: Checkout glific-frontend (read-only context)
        if: steps.pr.outputs.is_auto_docs == 'true'
        uses: actions/checkout@v7
        with:
          repository: glific/glific-frontend
          path: repos/glific-frontend
          fetch-depth: 1

      - name: Check out any PR branches referenced in the comment
        if: steps.pr.outputs.is_auto_docs == 'true'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          frontend_pr=$(printf '%s' "$COMMENT_BODY" | grep -oE 'github\.com/glific/glific-frontend/pull/[0-9]+' | grep -oE '[0-9]+$' | head -1 || true)
          backend_pr=$(printf '%s' "$COMMENT_BODY" | grep -oE 'github\.com/glific/glific/pull/[0-9]+' | grep -oE '[0-9]+$' | head -1 || true)

          if [ -n "$frontend_pr" ]; then
            git -C repos/glific-frontend fetch --depth 1 origin "refs/pull/${frontend_pr}/head"
            git -C repos/glific-frontend checkout FETCH_HEAD
          fi

          if [ -n "$backend_pr" ]; then
            git -C repos/glific fetch --depth 1 origin "refs/pull/${backend_pr}/head"
            git -C repos/glific checkout FETCH_HEAD
          fi

      - name: Build prompt
        if: steps.pr.outputs.is_auto_docs == 'true'
        id: build_prompt
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_PATH: ${{ github.event.comment.path }}
          COMMENT_LINE: ${{ github.event.comment.line || github.event.comment.original_line }}
          COMMENT_DIFF_HUNK: ${{ github.event.comment.diff_hunk }}
        run: |
          # Inline review comments (pull_request_review_comment) carry a
          # file/line/diff_hunk; general PR comments (issue_comment) don't —
          # give Claude an explicit, honest description of which kind this is
          # rather than silently dropping the extra precision when present.
          if [ -n "$COMMENT_PATH" ]; then
            LOCATION_CONTEXT=$(printf 'This comment is attached to a specific line in the diff, not a general PR comment:\n- File: %s\n- Line: %s\n- Diff context:\n```\n%s\n```\n' "$COMMENT_PATH" "$COMMENT_LINE" "$COMMENT_DIFF_HUNK")
          else
            LOCATION_CONTEXT="This is a general comment on the PR, not attached to a specific file or line."
          fi
          export LOCATION_CONTEXT

          # Fetch the template from main rather than trusting it's on the PR's
          # own branch — a PR opened before this workflow existed won't have
          # it. Write to /tmp so it never touches this checkout's working
          # tree, which the guardrail step checks is untouched outside docs/.
          git fetch --depth 1 origin main
          git show origin/main:.github/scripts/docs-agent-comment-prompt.md > /tmp/comment-prompt-template.md
          envsubst < /tmp/comment-prompt-template.md > /tmp/prompt.md
          {
            echo 'prompt<<EOF_PROMPT_9f3a1c'
            cat /tmp/prompt.md
            echo 'EOF_PROMPT_9f3a1c'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude comment-response step
        if: steps.pr.outputs.is_auto_docs == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.build_prompt.outputs.prompt }}
          claude_args: |
            --max-turns 35
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git branch:*)"

      - name: Remove cloned context repos (never committed, not screenshotted)
        if: steps.pr.outputs.is_auto_docs == 'true'
        run: rm -rf repos

      - name: Reset action-managed config files (not real edits)
        # claude-code-action treats a checked-out PR branch as untrusted and
        # overwrites CLAUDE.md and friends with origin/main's versions before
        # running, to block prompt-injection via a malicious PR's CLAUDE.md.
        # That substitution shows up as a working-tree diff whenever the PR
        # branch's committed version differs from current main (e.g. any
        # auto-docs PR opened before a later CLAUDE.md edit) — not something
        # Claude or the commenter asked for, so undo it before the guardrail
        # runs, or every such PR would false-fail here forever.
        if: steps.pr.outputs.is_auto_docs == 'true'
        run: |
          for f in CLAUDE.md .claude .mcp.json .claude.json .gitmodules .ripgreprc CLAUDE.local.md .husky; do
            git checkout -- "$f" 2>/dev/null || true
          done

      - name: Guardrail - confirm Claude only touched docs/ and comment-response.md
        if: steps.pr.outputs.is_auto_docs == 'true'
        id: guardrail
        run: |
          # -z (not plain --porcelain) — see auto-docs.yml for why: doc folder
          # names contain spaces and git quotes any such path by default,
          # which breaks naive parsing.
          bad=0
          changed=0
          while IFS= read -r -d '' entry; do
            status="${entry:0:2}"
            f="${entry:3}"
            case "$status" in
              R*|C*) read -r -d '' _orig ;;
            esac
            changed=1
            case "$f" in
              docs/*|comment-response.md|.github/screenshot-steps/*) ;;
              *)
                echo "::error::Unexpected file changed outside docs/: $f"
                bad=1
                ;;
            esac
          done < <(git status --porcelain -z)

          if [ "$bad" = "1" ]; then
            echo "Claude's changes touched files outside the allowed scope. Aborting without committing." >&2
            exit 1
          fi

          has_doc_changes=$(git status --porcelain -z -- docs | tr -d '\0')
          if [ -n "$has_doc_changes" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.pr.outputs.is_auto_docs == 'true' && steps.guardrail.outputs.has_changes == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        if: steps.pr.outputs.is_auto_docs == 'true' && steps.guardrail.outputs.has_changes == 'true'
        run: yarn install --frozen-lockfile

      - name: Install Playwright browser
        if: steps.pr.outputs.is_auto_docs == 'true' && steps.guardrail.outputs.has_changes == 'true'
        run: npx playwright install --with-deps chromium

      - name: Take screenshots and rewrite placeholders
        if: steps.pr.outputs.is_auto_docs == 'true' && steps.guardrail.outputs.has_changes == 'true'
        env:
          GLIFIC_STAGING_URL: ${{ secrets.GLIFIC_STAGING_URL }}
          GLIFIC_STAGING_PHONE: ${{ secrets.GLIFIC_STAGING_PHONE }}
          GLIFIC_STAGING_PASSWORD: ${{ secrets.GLIFIC_STAGING_PASSWORD }}
          ISSUE_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # Same reasoning as the prompt template in "Build prompt": the
          # script actually committed on this PR's branch can be an older,
          # possibly-buggy version — run whatever's current on main instead
          # of trusting the PR branch's copy. Safe to overwrite in place
          # since the guardrail check has already run by this point, and
          # "Commit and push" only ever `git add`s docs/ and
          # static/img/generated/, never .github/.
          git fetch --depth 1 origin main
          git show origin/main:.github/scripts/take-screenshots.mjs > .github/scripts/take-screenshots.mjs
          node .github/scripts/take-screenshots.mjs

      - name: Commit and push to the PR branch
        if: steps.pr.outputs.is_auto_docs == 'true' && steps.guardrail.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          [ -d static/img/generated ] && git add static/img/generated
          git commit -m "docs: address review feedback on PR #${{ steps.pr.outputs.number }}"
          git push origin "${{ steps.pr.outputs.head }}"

      - name: Reply with the result
        # always() because every earlier step (the guardrail, screenshot
        # capture, the push) can fail without ever posting anything back —
        # that's a silent failure from the commenter's point of view. job.status
        # reflects whatever's happened so far, not just this step's neighbors,
        # so it's the right gate for whether comment-response.md can be trusted.
        if: always() && steps.pr.outputs.is_auto_docs == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          if [ -f comment-response.md ]; then
            body_file=comment-response.md
          elif [ "${{ job.status }}" = "success" ]; then
            # Claude finished without error but didn't write the file it was
            # asked to — don't claim "the run failed" when it didn't; that's
            # just false and has actually happened in testing.
            printf '%s' "I finished looking at that but didn't leave a written explanation — check the \"Auto Docs (PR feedback)\" Actions run on this repo for what I actually did (most likely: no doc change was needed)." > /tmp/fallback-reply.md
            body_file=/tmp/fallback-reply.md
          else
            printf '%s' 'I wasn'"'"'t able to apply that request — the run failed before finishing. Check the "Auto Docs (PR feedback)" Actions run on this repo for details. No changes were made to this PR.' > /tmp/fallback-reply.md
            body_file=/tmp/fallback-reply.md
          fi

          if [ "$EVENT_NAME" = "pull_request_review_comment" ]; then
            # Reply in the same inline thread instead of a general PR comment.
            gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/comments/${COMMENT_ID}/replies" -f body="$(cat "$body_file")"
          else
            gh pr comment "$PR_NUMBER" --body-file "$body_file"
          fi
          rm -f comment-response.md 2>/dev/null || true
